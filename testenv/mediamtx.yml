# MediaMTX as a stand-in for go2rtc. RTSP over TCP only (as the app uses).
logLevel: warn
rtsp: yes
rtspTransports: [tcp]
rtspAddress: :8554
rtmp: no
hls: no
webrtc: no
srt: no
api: yes
apiAddress: :9997

# Test environment: anyone may publish, read and use the API (no RTSP auth).
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api

pathDefaults:
  runOnInitRestart: yes

paths:
  # Published by the cam-front-door container (can be stopped/paused).
  front_door:
  front_door_sub:

  # Normal case: H.264 + AAC, with substream.
  garden:
    runOnInit: >-
      ffmpeg -hide_banner -loglevel warning -re -f lavfi -i smptebars=size=960x540:rate=20
      -f lavfi -i sine=frequency=660:sample_rate=48000
      -c:v libx264 -preset ultrafast -tune zerolatency -g 20 -c:a aac -b:a 64k
      -f rtsp -rtsp_transport tcp rtsp://localhost:8554/garden
  garden_sub:
    runOnInit: >-
      ffmpeg -hide_banner -loglevel warning -re -f lavfi -i smptebars=size=480x270:rate=10
      -c:v libx264 -preset ultrafast -tune zerolatency -g 10 -an
      -f rtsp -rtsp_transport tcp rtsp://localhost:8554/garden_sub

  # Video only (no audio).
  driveway:
    runOnInit: >-
      ffmpeg -hide_banner -loglevel warning -re -f lavfi -i testsrc=size=640x480:rate=15
      -c:v libx264 -preset ultrafast -tune zerolatency -g 15 -an
      -f rtsp -rtsp_transport tcp rtsp://localhost:8554/driveway

  # H.265/HEVC: only plays if the tablet can decode HEVC.
  garage:
    runOnInit: >-
      ffmpeg -hide_banner -loglevel warning -re -f lavfi -i testsrc2=size=1280x720:rate=15
      -c:v libx265 -preset ultrafast -tune zerolatency -x265-params keyint=15:log-level=error -an
      -f rtsp -rtsp_transport tcp rtsp://localhost:8554/garage

  # G.711 A-law audio (like many doorbells/IP cameras).
  doorbell:
    runOnInit: >-
      ffmpeg -hide_banner -loglevel warning -re -f lavfi -i testsrc2=size=640x480:rate=15
      -f lavfi -i sine=frequency=880:sample_rate=8000
      -c:v libx264 -preset ultrafast -tune zerolatency -g 15 -c:a pcm_alaw -ar 8000 -ac 1
      -f rtsp -rtsp_transport tcp rtsp://localhost:8554/doorbell

  # Uncompressed PCM audio (L16).
  shed:
    runOnInit: >-
      ffmpeg -hide_banner -loglevel warning -re -f lavfi -i mandelbrot=size=640x360:rate=10
      -f lavfi -i sine=frequency=330:sample_rate=16000
      -c:v libx264 -preset ultrafast -tune zerolatency -g 10 -c:a pcm_s16be -ar 16000 -ac 1
      -f rtsp -rtsp_transport tcp rtsp://localhost:8554/shed

  # Short keyframe interval (0.5 s).
  fast_gop:
    runOnInit: >-
      ffmpeg -hide_banner -loglevel warning -re -f lavfi -i testsrc2=size=640x360:rate=20
      -c:v libx264 -preset ultrafast -tune zerolatency -g 10 -an
      -f rtsp -rtsp_transport tcp rtsp://localhost:8554/fast_gop

  # Long keyframe interval (10 s): the first frame can take up to 10 s (watchdog must not fire).
  slow_gop:
    runOnInit: >-
      ffmpeg -hide_banner -loglevel warning -re -f lavfi -i testsrc2=size=640x360:rate=10
      -c:v libx264 -preset ultrafast -tune zerolatency -g 100 -keyint_min 100 -sc_threshold 0 -an
      -f rtsp -rtsp_transport tcp rtsp://localhost:8554/slow_gop

  # Full HD.
  back_door:
    runOnInit: >-
      ffmpeg -hide_banner -loglevel warning -re -f lavfi -i testsrc2=size=1920x1080:rate=15
      -c:v libx264 -preset ultrafast -tune zerolatency -g 15 -an
      -f rtsp -rtsp_transport tcp rtsp://localhost:8554/back_door

  # Stream not present in the Frigate config: appears as a standalone camera (with _sub).
  carport:
    runOnInit: >-
      ffmpeg -hide_banner -loglevel warning -re -f lavfi -i rgbtestsrc=size=640x360:rate=10
      -c:v libx264 -preset ultrafast -tune zerolatency -g 10 -an
      -f rtsp -rtsp_transport tcp rtsp://localhost:8554/carport
  carport_sub:
    runOnInit: >-
      ffmpeg -hide_banner -loglevel warning -re -f lavfi -i rgbtestsrc=size=320x180:rate=5
      -c:v libx264 -preset ultrafast -tune zerolatency -g 5 -an
      -f rtsp -rtsp_transport tcp rtsp://localhost:8554/carport_sub
