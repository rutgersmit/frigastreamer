# Local test environment for FrigaStreamer, without a real Frigate.
#
#   cd testenv && docker compose up -d
#
# - mediamtx       : RTSP server on :8554 (plays the role of go2rtc) with >= 10 test pattern streams
# - cam-front-door : separate ffmpeg process for 'front_door' + 'front_door_sub', so you can stop
#                    (docker compose stop) or freeze (docker compose pause) this one camera
# - frigate-mock   : mimics /api/go2rtc/streams, /api/config, /api/version and /api/login
#                    on :5000 (internal, no auth) and :8971 (with login, HTTP instead of HTTPS)
#
# See README.md, section "Test environment", for simulating failures.

services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.4-ffmpeg
    container_name: fs-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"
      - "9997:9997" # MediaMTX API (handy for inspecting paths)
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  cam-front-door:
    image: bluenviron/mediamtx:1.21.4-ffmpeg
    container_name: fs-cam-front-door
    restart: unless-stopped
    depends_on: [mediamtx]
    entrypoint: ["/bin/sh", "-c"]
    # main: H.264 1280x720 + AAC, keyframe every second; sub: H.264 640x360 without audio.
    command:
      - >-
        while true; do
        ffmpeg -hide_banner -loglevel warning -re
        -f lavfi -i testsrc2=size=1280x720:rate=25
        -f lavfi -i sine=frequency=440:sample_rate=48000
        -filter_complex "[0:v]split=2[m][s];[s]scale=640:360[sv]"
        -map "[m]" -map 1:a -c:v libx264 -preset ultrafast -tune zerolatency -g 25 -c:a aac -b:a 64k
        -f rtsp -rtsp_transport tcp rtsp://mediamtx:8554/front_door
        -map "[sv]" -c:v libx264 -preset ultrafast -tune zerolatency -g 25 -an
        -f rtsp -rtsp_transport tcp rtsp://mediamtx:8554/front_door_sub;
        sleep 2; done

  frigate-mock:
    image: python:3.12-alpine
    container_name: fs-frigate-mock
    restart: unless-stopped
    depends_on: [mediamtx]
    ports:
      - "5000:5000"
      - "8971:8971"
    volumes:
      - ./mock:/mock:ro
    environment:
      MEDIAMTX_API: http://mediamtx:9997
      MOCK_USER: admin
      MOCK_PASSWORD: admin
    command: ["python", "-u", "/mock/frigate_mock.py"]
