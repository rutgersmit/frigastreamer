name: Build

on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# Least privilege by default. Only the release job gets write access.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Signing secrets are only used for pushes and manual runs in the main repository,
  # never for pull requests (including PRs from forks).
  CAN_SIGN: ${{ github.repository == 'rutgersmit/frigastreamer' && github.event_name != 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      apk_name: ${{ steps.apk.outputs.name }}
      version_name: ${{ steps.version.outputs.version_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "APP_VERSION_NAME=${VERSION}" >> "$GITHUB_ENV"
          echo "version_name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "versionName=${VERSION}, versionCode=${GITHUB_RUN_NUMBER}"

      # The Android SDK is preinstalled on ubuntu-latest; the Android Gradle Plugin downloads a
      # missing platform (compileSdk) itself because the licenses are already accepted on the runner.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Test summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          total = failed = skipped = 0
          rows = []
          for f in sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml')):
              s = ET.parse(f).getroot()
              t, fl, sk = int(s.get('tests')), int(s.get('failures')) + int(s.get('errors')), int(s.get('skipped'))
              total += t; failed += fl; skipped += sk
              rows.append(f"| {s.get('name').split('.')[-1]} | {t} | {fl} | {sk} |")
          print("## Unit tests\n")
          print(f"**{total} tests, {failed} failed, {skipped} skipped**\n")
          print("| Test class | Tests | Failed | Skipped |\n|---|---|---|---|")
          print("\n".join(rows))
          EOF

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      - name: Check signing secrets
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ env.CAN_SIGN == 'true' && secrets.SIGNING_KEYSTORE_BASE64 || '' }}
          SIGNING_STORE_PASSWORD: ${{ env.CAN_SIGN == 'true' && secrets.SIGNING_STORE_PASSWORD || '' }}
          SIGNING_KEY_ALIAS: ${{ env.CAN_SIGN == 'true' && secrets.SIGNING_KEY_ALIAS || '' }}
          SIGNING_KEY_PASSWORD: ${{ env.CAN_SIGN == 'true' && secrets.SIGNING_KEY_PASSWORD || '' }}
        run: |
          if [[ "$CAN_SIGN" != "true" ]]; then
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              echo "::error::Releases are only built in the main repository (rutgersmit/frigastreamer)."
              exit 1
            fi
            echo "Signing is disabled for this event (pull request or fork): building an unsigned debug APK."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=()
          [[ -z "$SIGNING_KEYSTORE_BASE64" ]] && missing+=(SIGNING_KEYSTORE_BASE64)
          [[ -z "$SIGNING_STORE_PASSWORD" ]] && missing+=(SIGNING_STORE_PASSWORD)
          [[ -z "$SIGNING_KEY_ALIAS" ]] && missing+=(SIGNING_KEY_ALIAS)
          [[ -z "$SIGNING_KEY_PASSWORD" ]] && missing+=(SIGNING_KEY_PASSWORD)
          if (( ${#missing[@]} > 0 )); then
            msg="Release signing not possible: missing GitHub Secret(s): ${missing[*]}. See README > One-time setup."
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              echo "::error::$msg A release is never signed with a debug key."
              exit 1
            fi
            echo "::warning::$msg Only unit tests and a debug build are run."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Release build (signed)
        if: steps.signing.outputs.available == 'true'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Debug build (no signing secrets available)
        if: steps.signing.outputs.available != 'true'
        run: ./gradlew assembleDebug --stacktrace

      - name: Stage APK and verify signature
        id: apk
        run: |
          mkdir -p dist
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          if [[ "${{ steps.signing.outputs.available }}" == "true" ]]; then
            SRC=app/build/outputs/apk/release/app-release.apk
            NAME="FrigaStreamer-${APP_VERSION_NAME}.apk"
          else
            SRC=app/build/outputs/apk/debug/app-debug.apk
            NAME="FrigaStreamer-${APP_VERSION_NAME}-debug.apk"
          fi
          cp "$SRC" "dist/$NAME"
          "$BT/apksigner" verify --print-certs "dist/$NAME" | grep -E "Signer #1 certificate (DN|SHA-256)" || true
          "$BT/aapt2" dump badging "dist/$NAME" | head -1
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: dist/${{ steps.apk.outputs.name }}
          if-no-files-found: error

  release:
    # Only for v* tags in the main repository.
    if: github.repository == 'rutgersmit/frigastreamer' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK: dist/${{ needs.build.outputs.apk_name }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Re-run workflow: replace the asset so exactly one APK remains.
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" \
              --title "FrigaStreamer ${VERSION_NAME}" \
              --generate-notes \
              --verify-tag
          fi
